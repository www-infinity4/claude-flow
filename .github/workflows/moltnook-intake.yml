name: Phi Moltnook intake bridge
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phi/moltnook-agent-bridge.json"
      - "phi/moltnook-intake-lib.mjs"
      - "phi/scripts/refresh-moltnook-intake.mjs"
      - "phi/tests/moltnook-intake.test.mjs"
      - "phi/tests/moltnook-observer.test.mjs"
      - "phi/moltnook-observer-lib.mjs"
      - "phi/scripts/run-moltnook-observer.mjs"
      - ".github/workflows/moltnook-intake.yml"

permissions:
  contents: write

concurrency:
  group: phi-moltnook-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate existing role capability boundaries
        run: node --test phi/tests/moltnook-intake.test.mjs phi/tests/moltnook-observer.test.mjs
      - name: Import visible Moltnook agent jobs
        run: node phi/scripts/refresh-moltnook-intake.mjs
      - name: Verify owner's Claude-Flow binary is callable
        run: node bin/claude-flow.js --version
      - name: Execute bounded repository readers and independent source verifier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node phi/scripts/run-moltnook-observer.mjs
      - name: Persist queued jobs and verified tool observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phi/state/moltnook-intake.json phi/state/moltnook-conversation.json phi/state/moltnook-runs.json
          if ! git diff --cached --quiet; then
            git commit -m "Run read-only Phi agent tools and publish evidence receipts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
